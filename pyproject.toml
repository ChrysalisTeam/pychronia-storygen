[tool.poetry]
name = "pychronia-storygen"
version = "0.1.0"
description = "Generates the PDF documents of a mystery party from restructuredtext/jinja2 templates"
authors = ["Pascal Chambon <pythoniks@gmail.com>"]
readme = "README.rst"
packages = [{include = "pychronia_storygen", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
jinja2 = "^3.1.3"
click = "^8.1.7"
pyyaml = "^6.0.1"
jinja-macro-tags-pakal = "^1.0.0"
rst2pdf = "^0.101"
docutils = ">=0.20.1,<0.22"  # rst2pdf 0.101 imports docutils.utils.roman, removed in docutils 0.22
reportlab = "^4.1.0"
pypdf = "^7.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.poetry.scripts]
pychronia_storygen = "pychronia_storygen.cli:cli"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
